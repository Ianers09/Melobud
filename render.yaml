# Render Blueprint — New > Blueprint > select this repository.
# Values marked `sync: false` are entered in the Render dashboard (never committed).
services:
  - type: web
    name: melobud
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DB_TRANSACTION_POOLER
        value: "true"
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      # Render's free plan blocks the usual SMTP ports (25/465/587); Brevo also listens on 2525.
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: Melobud <melobud23@gmail.com>

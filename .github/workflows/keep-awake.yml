# Backup for the in-app keep-awake: wakes the Render service if it ever sleeps
# (for example after a restart). Set the repository variable RENDER_URL
# (Settings > Secrets and variables > Actions > Variables), e.g. https://melobud.onrender.com
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_URL is not set; skipping."
            exit 0
          fi
          # Retry while a sleeping service starts (about one minute).
          curl --silent --show-error --fail --retry 5 --retry-delay 20 --retry-all-errors --max-time 90 "$RENDER_URL/api/health/"
